<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#eef2ff">
    <title>模拟驾驶安全考试</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="blood-overlay" aria-hidden="true"></div>
    <div id="effect-overlay" aria-hidden="true"></div>
    <div id="word-storm" aria-hidden="true"></div>

    <header id="game-toolbar" class="game-toolbar" aria-label="游戏设置">
        <button id="mute-btn" class="icon-btn" type="button" aria-pressed="false">声音：开</button>
        <button id="motion-btn" class="icon-btn" type="button" aria-pressed="false">动态：开</button>
        <button id="toolbar-restart-btn" class="icon-btn danger-quiet" type="button">重新开始</button>
    </header>

    <main>
        <section id="start-page" class="page active" aria-labelledby="start-title">
            <div class="container start-card">
                <p class="eyebrow">SIMULATED DRIVING TEST</p>
                <h1 id="start-title">模拟驾驶安全考试</h1>
                <p class="lead">共51个题号。请根据道路交通安全知识完成作答。</p>
                <div class="start-actions">
                    <button id="continue-btn" class="primary-btn" type="button" hidden>继续考试</button>
                    <button id="start-btn" class="secondary-btn" type="button">开始新考试</button>
                </div>
                <p id="save-summary" class="save-summary" hidden></p>
            </div>
        </section>

        <section id="quiz-page" class="page" aria-labelledby="question-text">
            <div id="quiz-card" class="container quiz-card">
                <div class="quiz-header">
                    <div class="progress" aria-label="答题进度">
                        <span id="current-question">1</span><span class="progress-divider">/</span><span id="total-questions">51</span>
                    </div>
                    <span id="mode-indicator" class="mode-indicator">日间</span>
                </div>

                <div class="question-container">
                    <p id="question-text"></p>
                    <div id="question-image" class="question-image" hidden></div>
                    <div id="image-placeholder" class="image-placeholder" hidden></div>

                    <div id="options" class="options" role="group" aria-label="答案选项"></div>
                    <div id="result-message" class="result-message" role="status" aria-live="polite"></div>
                    <div id="answer-analysis" class="answer-analysis" hidden></div>

                    <div class="question-actions">
                        <button id="prev-btn" class="nav-btn prev-btn" type="button">← 上一题</button>
                        <button id="submit-btn" class="primary-btn compact" type="button" hidden>提交答案</button>
                        <button id="next-btn" class="nav-btn next-btn" type="button" hidden>下一题 →</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="be-page" class="page" aria-labelledby="be-title">
            <div class="container ending-card bad-ending-card">
                <p class="eyebrow">BAD END</p>
                <h1 id="be-title">考试中止</h1>
                <p>尖叫声被黑暗吞没，一切又回到了入口。</p>
                <div class="start-actions">
                    <button id="retry-hidden-btn" class="primary-btn" type="button">从隐藏入口重试</button>
                    <button id="be-restart-btn" class="secondary-btn" type="button">彻底重新开始</button>
                </div>
            </div>
        </section>

        <section id="rewind-page" class="page" aria-labelledby="rewind-title">
            <div class="container ending-card rewind-card">
                <p class="eyebrow">REWIND STARTED</p>
                <h1 id="rewind-title">回到过去</h1>
                <p>时间已经开始倒转。故事将在新的第49题继续。</p>
                <img id="rewind-image" src="配图/50图.png" alt="白衣女子、孩子与鹿的全家福">
                <button id="rewind-restart-btn" class="secondary-btn" type="button">重新开始</button>
            </div>
        </section>
    </main>

    <div id="modal" class="modal" hidden aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <h2 id="modal-title"></h2>
            <p id="modal-message"></p>
            <div id="modal-buttons" class="modal-buttons"></div>
        </div>
    </div>

    <aside id="debug-panel" class="debug-panel" hidden>
        <strong>剧情测试</strong>
        <button type="button" data-debug-action="hidden">隐藏线入口</button>
        <button type="button" data-debug-action="38">第38题</button>
        <button type="button" data-debug-action="49">第49题</button>
        <button type="button" data-debug-action="50">第50题</button>
    </aside>

    <script defer src="js/game-data.js"></script>
    <script defer src="js/save-manager.js"></script>
    <script defer src="js/game-engine.js"></script>
    <script defer src="js/effect-runner.js"></script>
    <script defer src="script.js"></script>
</body>
</html>
